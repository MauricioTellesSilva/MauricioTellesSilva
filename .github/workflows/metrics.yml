name: Update Profile README Text Stats
on:
  schedule:
    - cron: "0 0 * * *" # Executa 1 vez por dia (às 00:00 UTC)
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Custom Text
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python - << 'EOF'
          import os
          import requests
          import re
          import time
          from datetime import datetime, timezone
          import unicodedata

          token = os.getenv("GH_TOKEN")
          username = os.getenv("GH_USERNAME")
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}

          readme_file = None
          for f in os.listdir("."):
              if f.lower() == "readme.md":
                  readme_file = f
                  break
          
          if not readme_file:
              print("Erro: README.md não encontrado!")
              exit(1)

          # 1. Buscar dados de Commits e PRs via Search API (Global)
          search_commits_count = 0
          try:
              commit_search = requests.get(f"https://api.github.com/search/commits?q=author:{username}", headers=headers).json()
              if isinstance(commit_search, dict) and "total_count" in commit_search:
                  search_commits_count = commit_search["total_count"]
          except:
              pass

          total_prs = "Indisponivel"
          try:
              pr_search = requests.get(f"https://api.github.com/search/issues?q=author:{username}+type:pr", headers=headers).json()
              if isinstance(pr_search, dict) and "total_count" in pr_search:
                  total_prs = pr_search["total_count"]
          except:
              pass

          # 2. Varredura e mapeamento seletivo de repositórios (Excluindo Alvo)
          unique_repos = set()
          page = 1
          while True:
              resp = requests.get(f"https://api.github.com/user/repos?per_page=100&page={page}", headers=headers)
              if resp.status_code != 200 or not resp.json():
                  break
              for r in resp.json():
                  # Condicional estrita para ignorar forks e o repositório específico
                  if not r.get("fork") and r["name"] != "MauricioTellesSilva":
                      unique_repos.add((r["name"], r["owner"]["login"]))
              page += 1

          total_additions = 0
          total_deletions = 0
          languages_map = {}

          def listar_branches(owner, repo):
              """Retorna a lista de nomes de todas as branches do repositório (paginado)."""
              branches = []
              page = 1
              while True:
                  resp = requests.get(
                      f"https://api.github.com/repos/{owner}/{repo}/branches?per_page=100&page={page}",
                      headers=headers,
                  )
                  if resp.status_code != 200:
                      break
                  data = resp.json()
                  if not data:
                      break
                  branches.extend(b["name"] for b in data)
                  page += 1
              return branches

          def listar_commits_do_autor(owner, repo, branch):
              """Retorna a lista de SHAs de commits do autor em uma branch específica (paginado)."""
              shas = []
              page = 1
              while True:
                  resp = requests.get(
                      f"https://api.github.com/repos/{owner}/{repo}/commits",
                      headers=headers,
                      params={"sha": branch, "author": username, "per_page": 100, "page": page},
                  )
                  if resp.status_code != 200:
                      break
                  data = resp.json()
                  if not isinstance(data, list) or not data:
                      break
                  shas.extend(c["sha"] for c in data)
                  page += 1
              return shas

          # 3. Extração de métricas por repositório filtrado, varrendo TODAS as branches
          for repo_name, repo_owner in unique_repos:
              processed_shas = set()  # evita contar o mesmo commit 2x (commits compartilhados entre branches)

              try:
                  branches = listar_branches(repo_owner, repo_name)
              except:
                  branches = []

              for branch in branches:
                  try:
                      shas = listar_commits_do_autor(repo_owner, repo_name, branch)
                  except:
                      shas = []

                  for sha in shas:
                      if sha in processed_shas:
                          continue
                      processed_shas.add(sha)

                      try:
                          commit_resp = requests.get(
                              f"https://api.github.com/repos/{repo_owner}/{repo_name}/commits/{sha}",
                              headers=headers,
                          )
                          # Respeita o rate limit secundário da API de commits individuais
                          if commit_resp.status_code == 403:
                              time.sleep(2.5)
                              commit_resp = requests.get(
                                  f"https://api.github.com/repos/{repo_owner}/{repo_name}/commits/{sha}",
                                  headers=headers,
                              )

                          if commit_resp.status_code == 200:
                              stats = commit_resp.json().get("stats", {})
                              total_additions += stats.get("additions", 0)
                              total_deletions += stats.get("deletions", 0)
                      except:
                          pass

              # Coleta de volumetria de linguagens
              try:
                  lang_resp = requests.get(f"https://api.github.com/repos/{repo_owner}/{repo_name}/languages", headers=headers)
                  if lang_resp.status_code == 200:
                      for lang, bytes_count in lang_resp.json().items():
                          languages_map[lang] = languages_map.get(lang, 0) + bytes_count
              except:
                  pass

          # 4. Distribuição das quatro linguagens com maior volume de código
          total_bytes = sum(languages_map.values())
          sorted_langs = sorted(languages_map.items(), key=lambda x: x[1], reverse=True)[:4]
          language_rows = []
          for lang, bytes_count in sorted_langs:
              if total_bytes <= 0:
                  continue
              percentage = bytes_count / total_bytes * 100
              filled = max(0, min(20, round(percentage / 5)))
              bar = "#" * filled + "-" * (20 - filled)
              label = unicodedata.normalize("NFKD", lang).encode("ascii", "replace").decode("ascii")
              percentage_text = f"{percentage:.1f}".replace(".", ",")
              language_rows.append((label, bar, percentage_text))

          # 5. Números em formato brasileiro
          def format_number(value):
              return f"{value:,}".replace(",", ".") if isinstance(value, int) else str(value)

          str_additions = format_number(total_additions)
          str_deletions = format_number(total_deletions)
          updated_at = datetime.now(timezone.utc).strftime("%d/%m/%Y %H:%M UTC")

          # 6. Painel ASCII em bloco monoespaçado, com bordas de largura dinâmica
          panel_lines = [
              "ACTIVITY",
              f"  Commits           : {format_number(search_commits_count)}",
              f"  Pull requests     : {format_number(total_prs)}",
              f"  Repos analisados  : {format_number(len(unique_repos))}",
              None,
              "CODE CHANGES",
              f"  Linhas adicionadas: +{str_additions}",
              f"  Linhas removidas  : -{str_deletions}",
              None,
              "LANGUAGES / TOP 4",
          ]
          if language_rows:
              label_width = max(12, max(len(label) for label, _, _ in language_rows))
              for label, bar, percentage_text in language_rows:
                  panel_lines.append(f"  {label:<{label_width}} [{bar}] {percentage_text:>5}%")
          else:
              panel_lines.append("  Dados indisponiveis nesta atualizacao.")
          panel_lines.extend([None, f"UPDATED / {updated_at}"])
          panel_width = max(58, max(len(line) for line in panel_lines if line is not None))
          border = "+" + "-" * (panel_width + 2) + "+"
          stats_lines = ["```text", border]
          for line in panel_lines:
              stats_lines.append(border if line is None else f"| {line:<{panel_width}} |")
          stats_lines.extend([
              border,
              "```",
              "",
              "<sub>Top 4 por volume de código em bytes; os percentuais consideram todas as linguagens dos repositórios analisados.</sub>",
              "",
              "<sub>Commits e pull requests: histórico do autor no GitHub. Linhas: commits do autor em todas as branches dos repositórios analisados, sem duplicar commits compartilhados. Forks e este repositório de perfil ficam fora da análise de código.</sub>",
              "",
              "<sub>Atualizado automaticamente via [GitHub Actions](.github/workflows/metrics.yml).</sub>",
          ])
          stats_content = "\n".join(stats_lines)
          # 7. Parser Posicional e Escrita Segura
          with open(readme_file, "r", encoding="utf-8") as f:
              readme_content = f.read()

          tag_start = "<!-- START_STATS -->"
          tag_end = "<!-- END_STATS -->"

          if tag_start in readme_content and tag_end in readme_content:
              # Remove resíduos colados nas tags para alinhar os ponteiros
              start_idx = readme_content.find(tag_start) + len(tag_start)
              end_idx = readme_content.find(tag_end)
              
              if start_idx <= end_idx:
                  # Força a reconstrução limpando o miolo antigo e injetando o novo com espaçamento limpo
                  before = readme_content[:start_idx].rstrip()
                  after = readme_content[end_idx:].lstrip()
                  
                  updated_content = f"{before}\n\n{stats_content.strip()}\n\n{after}"
                  
                  with open(readme_file, "w", encoding="utf-8") as f:
                      f.write(updated_content)
                  print("README atualizado com sucesso e blocos antigos limpos!")
              else:
                  print("Erro: A tag de fim está posicionada antes da tag de início.")
                  exit(1)
          else:
              print("Erro de barreira: As tags protetoras não foram encontradas no README.md!")
              exit(1)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: atualiza estatísticas globais de texto [skip ci]"
          git push
